<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Redirection</title>
</head>
<body>
    <script>
        const r = atob('aHR0cHM6Ly93d3cubW9uZGlhbHJlbGF5LmZyLw==');

        const a = document.createElement("a");
        a.href = r;
        a.rel = "noreferrer";

        document.body.appendChild(a);

        a.click();
    </script>
</body>
</html>
